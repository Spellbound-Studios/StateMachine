branches:
  - main
  - name: rc
    prerelease: true
  - name: beta
    prerelease: true
plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - breaking: true
          release: major
        - type: feat
          release: minor
        - type: fix
          release: patch
        - type: perf
          release: patch
        - type: refactor
          release: false
        - type: docs
          release: false
        - type: test
          release: false
        - type: build
          release: false
        - type: ci
          release: false
        - type: chore
          release: false
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      presetConfig:
        types:
          - type: feat
            section: Features
          - type: fix
            section: Fixes
          - type: perf
            section: Performance
          - type: refactor
            hidden: true
          - type: docs
            hidden: true
          - type: test
            hidden: true
          - type: build
            hidden: true
          - type: ci
            hidden: true
          - type: chore
            hidden: true
      writerOpts:
        headerPartial: |
          ## [{{version}}] - {{date}}
  - - "@semantic-release/changelog"
    - changelogFile: Packages/PackageName/CHANGELOG.md
  - - "@semantic-release/exec"
    - prepareCmd: bash scripts/set-package-version.sh ${nextRelease.version}
  - - "@semantic-release/git"
    - assets:
        - Packages/PackageName/package.json
        - Packages/PackageName/CHANGELOG.md
  - "@semantic-release/github"
